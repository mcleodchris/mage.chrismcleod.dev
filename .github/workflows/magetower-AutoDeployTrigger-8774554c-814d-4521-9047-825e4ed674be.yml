name: Trigger auto deployment for magetower

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/magetower-AutoDeployTrigger-8774554c-814d-4521-9047-825e4ed674be.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MAGETOWER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MAGETOWER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MAGETOWER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: magetower.azurecr.io
          registryUsername: ${{ secrets.MAGETOWER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MAGETOWER_REGISTRY_PASSWORD }}
          containerAppName: magetower
          resourceGroup: rg-magetower
          imageToBuild: magetower.azurecr.io/magetower:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


